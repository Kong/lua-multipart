name: Test

on: [push, pull_request]

env:
  LIBEXPAT_DOWNLOAD_URL: https://github.com/libexpat/libexpat/releases/download/R_2_5_0/expat-2.5.0.tar.gz

jobs:

  tests:
    name: Busted Tests

    strategy:
      matrix:
        openresty_version:
          - 1.17.8.2
          - 1.19.9.1
          - 1.27.1.1

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run tests
      run: |
        docker run --rm --init \
          -v "$PWD:/src" -w /src \
          -e OPENRESTY_VERSION=${{ matrix.openresty_version }} \
          -e LIBEXPAT_DOWNLOAD_URL \
          openresty/openresty:${{ matrix.openresty_version }}-alpine-fat \
          sh .github/scripts/run-tests.sh
